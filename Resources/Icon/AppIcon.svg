<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Lisvo（聽字）App 圖示（2026-10-29 定稿，方案 C）
       外框沿用 ArchCross Logo（jex/assets/images/brand/archcross-logo.svg）：深藍環、右下兩道缺口，與 Kaico 同位置。
       太陽換成三行長短不一的逐字稿：黃、深藍、黃交錯，代表不同講者輪流說話。
       外層依 macOS 圖示模板：1024 畫布、824 圓角方塊（圓角 185）置中、下方陰影；圖形縮放 824/1024。 -->
  <defs>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <mask id="ringGap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <line x1="556" y1="400" x2="1116" y2="960" stroke="#000" stroke-width="62"/>
      <line x1="468" y1="487" x2="1028" y2="1047" stroke="#000" stroke-width="62"/>
    </mask>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#F4F3EF" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <g transform="translate(100 100) scale(0.8046875)">
      <rect width="1024" height="1024" fill="#F4F3EF"/>
      <!-- 三行逐字稿：左緣對齊，長度不同；中線間距 122，整組垂直置中於環心 512 -->
      <g stroke-linecap="round" stroke-width="64">
        <line x1="330" y1="390" x2="640" y2="390" stroke="#FEC149"/>
        <line x1="330" y1="512" x2="700" y2="512" stroke="#233D4D"/>
        <line x1="330" y1="634" x2="560" y2="634" stroke="#FEC149"/>
      </g>
      <circle cx="512" cy="512" r="343.5" fill="none" stroke="#233D4D" stroke-width="59" mask="url(#ringGap)"/>
    </g>
  </g>
</svg>
